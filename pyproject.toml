[project]
name = "ibkr-sdk"
version = "0.1.2"
description = "A Python SDK for interacting with Interactive Brokers API"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Siddhesh Agarwal", email = "siddhesh.agarwal@gmail.com" },
]
dependencies = [
    "pydantic>=2.13.4",
    "requests>=2.34.2",
]
keywords = ["ibkr", "interactive brokers", "api", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
homepage = "https://github.com/Siddhesh-Agarwal/ibkr-sdk"
repository = "https://github.com/Siddhesh-Agarwal/ibkr-sdk"
documentation = "https://github.com/Siddhesh-Agarwal/ibkr-sdk/wiki"
"Bug Tracker" = "https://github.com/Siddhesh-Agarwal/ibkr-sdk/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "responses>=0.26.0",
    "ruff>=0.15.13",
    "ty>=0.0.37",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "TC",
    "I",
    "N",
    "PERF",
    "E",
    "W",
    "F",
    "PL",
    "UP",
    "RUF",
]
ignore = ["PLR2004"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
